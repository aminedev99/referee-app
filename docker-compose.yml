services:
  db:
    image: postgres:16-alpine
    container_name: referee_db_dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-referee_db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-referee_db}"]
      interval: 3s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: referee_backend_dev
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-referee_db}
      JWT_SECRET: ${JWT_SECRET:-super-secret-key-for-jwt-referee-app-2026}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-720}
      RECEIPTS_DIR: /code/receipts
      ENV: development
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@draarbitre.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-AdminSecure2026!}
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend/app:/code/app
      - ./receipts:/code/receipts
      - ./template:/code/template
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: referee_frontend_dev
    environment:
      PORT: 3000
      API_PROXY_TARGET: http://backend:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data_dev:
